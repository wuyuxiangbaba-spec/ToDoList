      const names = new Set(state.catalogs.map(c => c.name));
      while (names.has(name)) name = "新目录 " + (i++);
      // 新目录拥有独立的树：只有一棵可编辑的根节点（名称默认同目录名），
      // 不复制 DEFAULT_NODES 默认任务树。
      const cat = {
        id: genCatalogId(),
        name: name,
        nodes: [{
          id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name: name,
          parentId: null,
          done: false,
          completedAt: ""
        }],
        links: [],
        linkDone: {}
      };
      state.catalogs.push(cat);
      state.currentCatalogId = cat.id;
      pan = { x: 0, y: 0 };
      scale = 1;
      save();
      render();
      // 顺手打开侧栏内联改名，方便立刻改目录名
      const li = catalogList.querySelector(`[data-cat-id="${cat.id}"]`);
      if (li) startCatalogRename(li, cat);
    }

    function deleteCatalog(id) {
      if (state.catalogs.length <= 1) {
        alert("至少要保留一个目录，不能删除。");
        return;
      }
      const cat = state.catalogs.find(c => c.id === id);
      if (!cat) return;
      if (!confirm(`确定删除目录「${cat.name}」？该目录整棵树、打卡记录都会删除，且无法恢复。`)) return;
      state.catalogs = state.catalogs.filter(c => c.id !== id);
      // 清掉所有指向它的插入 logo（无论作为所在目录还是目标目录）
      state.catalogInserts = state.catalogInserts.filter(
        ins => ins.target !== id && ins.catalog !== id
      );
      if (state.currentCatalogId === id) {
        state.currentCatalogId = state.catalogs[0].id; // 自动切到剩下的目录
        pan = { x: 0, y: 0 };
        scale = 1;
      }
      save();
      render();
    }

    function startCatalogRename(li, cat) {
      const nameEl = li.querySelector(".catalog-item-name");
      if (!nameEl || li.querySelector(".catalog-rename-input")) return;
      // 先收起别处还开着的改名框
      if (catalogRenameClose) catalogRenameClose(false);
      const input = document.createElement("input");
      input.type = "text";
      input.className = "catalog-rename-input";
      input.maxLength = 40;
      input.value = cat.name;
      input.setAttribute("aria-label", "修改目录名称");
      nameEl.style.display = "none";
      li.insertBefore(input, nameEl);
      input.focus();
      input.select();
      let doneRename = false;
      const commit = ok => {
        if (doneRename) return;
        doneRename = true;
        catalogRenameClose = null;
        input.remove();
        nameEl.style.display = "";
        // applyCatalogRename：空名（trim 后为空）不保存、取消本次改名、保持原名；
        // 非空则更新目录名，且根节点名等于旧目录名时同步更新，最后 save + render
        // （render 会同步侧栏显示、树上插入标识的 title / aria-label 与根节点名）
        if (ok && applyCatalogRename(cat, input.value)) {
          save();
          render();
        }
      };
      catalogRenameClose = commit;
      input.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); commit(false); }
      });
      input.addEventListener("blur", () => commit(true)); // 失焦时若名称非空则保存
      input.addEventListener("pointerdown", ev => ev.stopPropagation());
      input.addEventListener("mousedown", ev => ev.stopPropagation());
      input.addEventListener("click", ev => ev.stopPropagation());
      input.addEventListener("dblclick", ev => ev.stopPropagation());
    }

    function clearCatDropMarks() {
      catTree.querySelectorAll(".cat-drop-over").forEach(el => el.classList.remove("cat-drop-over"));
    }

    // 把目录 catId 插入到当前目录树的 nodeId 分支上（出现 logo）
    function insertCatalogOnNode(catId, nodeId) {
      if (catId === state.currentCatalogId) {
        showLinkHint("不能把目录插入到它自己的树上", false);
        return;
      }
      const target = state.catalogs.find(c => c.id === catId);
      if (!target || !nodeById(nodeId)) return;
      const dup = state.catalogInserts.some(
        ins => ins.catalog === state.currentCatalogId && ins.node === nodeId && ins.target === catId
      );
      if (dup) {
        showLinkHint("该分支上已插入过此目录", false);
        return;
      }
      state.catalogInserts.push({ catalog: state.currentCatalogId, node: nodeId, target: catId });
      save();
      renderTree();
      showLinkHint(`已把「${target.name}」插入到该分支，点旁边的圆形目录标识可跳转`, false);
    }

    catalogCollapseBtn.addEventListener("click", () => {
      state.sidebarOpen = false;
      save();
      applySidebarOpen();
    });
    catalogRailBtn.addEventListener("click", () => {
      state.sidebarOpen = true;
      save();
      applySidebarOpen();
    });
    catalogAddBtn.addEventListener("click", () => createCatalog());

    catalogList.addEventListener("click", e => {
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      if (e.target.closest(".catalog-rename-input")) return;
      if (e.target.closest(".catalog-item-rename")) {
        const cat = state.catalogs.find(c => c.id === li.dataset.catId);
        if (cat) startCatalogRename(li, cat);
        return;
      }
      if (e.target.closest(".catalog-item-del")) {
        deleteCatalog(li.dataset.catId);
        return;
      }
      switchCatalog(li.dataset.catId);
    });

    // ---------- 目录右键菜单（改名） ----------
    const catCtxMenu = document.getElementById("catCtxMenu");
    let catCtxTargetId = null;

    function closeCatMenu() {
      catCtxMenu.hidden = true;
      catCtxTargetId = null;
    }
    catalogList.addEventListener("contextmenu", e => {
      if (e.target.closest(".catalog-rename-input")) return;
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      closeLinkMenu();
      catCtxTargetId = li.dataset.catId;
      catCtxMenu.hidden = false;
      catCtxMenu.style.left = e.clientX + "px";
      catCtxMenu.style.top = e.clientY + "px";
      requestAnimationFrame(() => {
        const r = catCtxMenu.getBoundingClientRect();
        if (r.right > innerWidth - 8) catCtxMenu.style.left = Math.max(8, innerWidth - r.width - 8) + "px";
        if (r.bottom > innerHeight - 8) catCtxMenu.style.top = Math.max(8, innerHeight - r.height - 8) + "px";
      });
    });
    catCtxMenu.addEventListener("click", e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn || !catCtxTargetId) return;
      const act = btn.dataset.act;
      const id = catCtxTargetId;
      closeCatMenu();
      if (act === "rename-catalog") {
        const cat = state.catalogs.find(c => c.id === id);
        const li = catalogList.querySelector('[data-cat-id="' + id + '"]');
        if (cat && li) startCatalogRename(li, cat);
      }
    });
    catCtxMenu.addEventListener("pointerdown", e => e.stopPropagation());
    catCtxMenu.addEventListener("contextmenu", e => e.preventDefault());

    catalogList.addEventListener("dblclick", e => {
      const nameEl = e.target.closest(".catalog-item-name");
      if (!nameEl) return;
      const li = nameEl.closest(".catalog-item");
      const cat = state.catalogs.find(c => c.id === (li && li.dataset.catId));
      if (cat) startCatalogRename(li, cat);
    });

    // 侧栏目录拖拽：用专用 dataTransfer 类型，不影响树上节点改挂载
    catalogList.addEventListener("dragstart", e => {
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      catalogDragId = li.dataset.catId;
      li.classList.add("dragging-cat");
      e.dataTransfer.effectAllowed = "link";
      e.dataTransfer.setData(CATALOG_DRAG_TYPE, String(catalogDragId));
      e.dataTransfer.setData("text/plain", "catalog:" + catalogDragId);
    });
    catalogList.addEventListener("dragend", () => {
      catalogDragId = null;
      catalogList.querySelectorAll(".dragging-cat").forEach(el => el.classList.remove("dragging-cat"));
      clearCatDropMarks();
    });

    applySidebarOpen();
    render();
  </script>
</body>
</html>
