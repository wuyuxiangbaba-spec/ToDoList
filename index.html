        catalogList.appendChild(li);
      }
    }

    function applySidebarOpen() {
      catalogSidebar.classList.toggle("collapsed", !state.sidebarOpen);
      catalogRailBtn.hidden = !!state.sidebarOpen;
      scheduleViewportUpdate(); // 侧栏收起/展开改变舞台宽度，刷新可见集
    }

    // 窗口尺寸变化：视野矩形变了，补画/回收可见节点
    window.addEventListener("resize", scheduleViewportUpdate);

    function switchCatalog(id) {
      const cat = state.catalogs.find(c => c.id === id);
      if (!cat) return;
      // 点击当前目录：直接返回，不重绘列表（否则会毁掉正在编辑的改名输入框，
      // 双击改名的第一次 click 也会把目标节点从 DOM 里抹掉）
      if (id === state.currentCatalogId) return;
      closeEditor(false);
      closeMenu();
      closeLinkMenu();
      if (linkMode) exitLinkMode();
      state.currentCatalogId = id;
      // 切目录时自动 fit：大树（如 NeurCross 函数级完整树）直接缩到整棵展开的树
      // 都进视野，绝不再停在 1:1 顶端把巨树整个画出来；小树维持接近 1:1 并居中。
      // 不再用 pan=0/scale=1 顶对齐（那是卡死的根源），平移/缩放仍按目录独立重置。
      pendingAutoFit = true;
      save();
      render();
    }

    function createCatalog() {
      let name = "新目录";
      let i = 2;
      const names = new Set(state.catalogs.map(c => c.name));
      while (names.has(name)) name = "新目录 " + (i++);
      // 新目录拥有独立的树：只有一棵可编辑的根节点（名称默认同目录名），
      // 不复制 DEFAULT_NODES 默认任务树。
      const cat = {
        id: genCatalogId(),
        name: name,
        nodes: [{
          id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name: name,
          parentId: null,
          done: false,
          completedAt: ""
        }],
        links: [],
        linkDone: {}
      };
      state.catalogs.push(cat);
      state.currentCatalogId = cat.id;
      pendingAutoFit = true; // 新目录是单节点小树：接近 1:1 居中即可
      save();
      render();
      // 顺手打开侧栏内联改名，方便立刻改目录名
      const li = catalogList.querySelector(`[data-cat-id="${cat.id}"]`);
      if (li) startCatalogRename(li, cat);
    }

    function deleteCatalog(id) {
      if (state.catalogs.length <= 1) {
        showToast("至少要保留一个目录，不能删除。", "error"); // 替代原生 alert
        return;
      }
      const cat = state.catalogs.find(c => c.id === id);
      if (!cat) return;
      // 自定义确认弹窗（Promise 化）替代原生 confirm：取消则不删
      confirmDialog(`确定删除目录「${cat.name}」？该目录整棵树、打卡记录都会删除，且无法恢复。`,
        { title: "删除目录", confirmText: "删除" })
        .then(ok => { if (ok) doDeleteCatalog(id); });
    }
    function doDeleteCatalog(id) {
      const cat = state.catalogs.find(c => c.id === id);
      if (!cat) return;
      if (cat.id === NEURCROSS_CATALOG_ID || cat.name === NEURCROSS_CATALOG_NAME) {
        state.neurCrossHidden = true; // 删除要能持久，刷新后不再自动补回
      }
      state.catalogs = state.catalogs.filter(c => c.id !== id);
      // 清掉所有指向它的插入 logo（无论作为所在目录还是目标目录）
      state.catalogInserts = state.catalogInserts.filter(
        ins => ins.target !== id && ins.catalog !== id
      );
      if (state.currentCatalogId === id) {
        state.currentCatalogId = state.catalogs[0].id; // 自动切到剩下的目录
        pendingAutoFit = true; // 切换后的目录也按其大小自动 fit
      }
      save();
      render();
    }

    function startCatalogRename(li, cat) {
      const nameEl = li.querySelector(".catalog-item-name");
      if (!nameEl || li.querySelector(".catalog-rename-input")) return;
      // 先收起别处还开着的改名框
      if (catalogRenameClose) catalogRenameClose(false);
      const input = document.createElement("input");
      input.type = "text";
      input.className = "catalog-rename-input";
      input.maxLength = 40;
      input.value = cat.name;
      input.setAttribute("aria-label", "修改目录名称");
      nameEl.style.display = "none";
      li.insertBefore(input, nameEl);
      input.focus();
      input.select();
      let doneRename = false;
      const commit = ok => {
        if (doneRename) return;
        doneRename = true;
        catalogRenameClose = null;
        input.remove();
        nameEl.style.display = "";
        // applyCatalogRename：空名（trim 后为空）不保存、取消本次改名、保持原名；
        // 非空则更新目录名，且根节点名等于旧目录名时同步更新，最后 save + render
        // （render 会同步侧栏显示、树上插入标识的 title / aria-label 与根节点名）
        if (ok && applyCatalogRename(cat, input.value)) {
          save();
          render();
        }
      };
      catalogRenameClose = commit;
      input.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); commit(false); }
      });
      input.addEventListener("blur", () => commit(true)); // 失焦时若名称非空则保存
      input.addEventListener("pointerdown", ev => ev.stopPropagation());
      input.addEventListener("mousedown", ev => ev.stopPropagation());
      input.addEventListener("click", ev => ev.stopPropagation());
      input.addEventListener("dblclick", ev => ev.stopPropagation());
    }

    function clearCatDropMarks() {
      catTree.querySelectorAll(".cat-drop-over").forEach(el => el.classList.remove("cat-drop-over"));
    }

    // 把目录 catId 插入到当前目录树的 nodeId 分支上（出现 logo）
    function insertCatalogOnNode(catId, nodeId) {
      if (catId === state.currentCatalogId) {
        showLinkHint("不能把目录插入到它自己的树上", false);
        return;
      }
      const target = state.catalogs.find(c => c.id === catId);
      if (!target || !nodeById(nodeId)) return;
      const dup = state.catalogInserts.some(
        ins => ins.catalog === state.currentCatalogId && ins.node === nodeId && ins.target === catId
      );
      if (dup) {
        showLinkHint("该分支上已插入过此目录", false);
        return;
      }
      state.catalogInserts.push({ catalog: state.currentCatalogId, node: nodeId, target: catId });
      save();
      renderTree();
      showLinkHint(`已把「${target.name}」插入到该分支，点旁边的圆形目录标识可跳转`, false);
    }

    catalogCollapseBtn.addEventListener("click", () => {
      if (isMobileLayout()) { setDrawerOpen(false); return; } // 移动端抽屉只关，不持久化桌面侧栏状态
      state.sidebarOpen = false;
      save(false); // 折叠侧栏是纯视图状态：照常落盘，但不入撤销历史
      applySidebarOpen();
    });
    catalogRailBtn.addEventListener("click", () => {
      state.sidebarOpen = true;
      save(false); // 展开侧栏同上：不入历史
      applySidebarOpen();
    });
    catalogAddBtn.addEventListener("click", () => createCatalog());

    // ---------- 移动端（视口 <760px）：目录侧栏 = 汉堡按钮呼出的可收起抽屉 ----------
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const drawerMask = document.getElementById("drawerMask");
    const mqMobile = window.matchMedia("(max-width: 759px)");
    function isMobileLayout() { return mqMobile.matches; }
    function setDrawerOpen(open) {
      catalogSidebar.classList.toggle("drawer-open", open);
      drawerMask.hidden = !(open && isMobileLayout());
    }
    mobileMenuBtn.addEventListener("click", () => setDrawerOpen(true));
    drawerMask.addEventListener("click", () => setDrawerOpen(false));
    mqMobile.addEventListener("change", () => { if (!isMobileLayout()) setDrawerOpen(false); });

    catalogList.addEventListener("click", e => {
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      if (e.target.closest(".catalog-rename-input")) return;
      // 移动端：点目录项/删除即收起抽屉（点 ✎ 改名除外，要留在抽屉里编辑）
      if (isMobileLayout() && !e.target.closest(".catalog-item-rename")) setDrawerOpen(false);
      if (e.target.closest(".catalog-item-rename")) {
        const cat = state.catalogs.find(c => c.id === li.dataset.catId);
        if (cat) startCatalogRename(li, cat);
        return;
      }
      if (e.target.closest(".catalog-item-del")) {
        deleteCatalog(li.dataset.catId);
        return;
      }
      switchCatalog(li.dataset.catId);
    });

    // ---------- 目录右键菜单（改名） ----------
    const catCtxMenu = document.getElementById("catCtxMenu");
    let catCtxTargetId = null;

    function closeCatMenu() {
      catCtxMenu.hidden = true;
      catCtxTargetId = null;
    }
    catalogList.addEventListener("contextmenu", e => {
      if (e.target.closest(".catalog-rename-input")) return;
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      closeLinkMenu();
      catCtxTargetId = li.dataset.catId;
      catCtxMenu.hidden = false;
      catCtxMenu.style.left = e.clientX + "px";
      catCtxMenu.style.top = e.clientY + "px";
      requestAnimationFrame(() => {
        const r = catCtxMenu.getBoundingClientRect();
        if (r.right > innerWidth - 8) catCtxMenu.style.left = Math.max(8, innerWidth - r.width - 8) + "px";
        if (r.bottom > innerHeight - 8) catCtxMenu.style.top = Math.max(8, innerHeight - r.height - 8) + "px";
      });
    });
    catCtxMenu.addEventListener("click", e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn || !catCtxTargetId) return;
      const act = btn.dataset.act;
      const id = catCtxTargetId;
      closeCatMenu();
      if (act === "rename-catalog") {
        const cat = state.catalogs.find(c => c.id === id);
        const li = catalogList.querySelector('[data-cat-id="' + id + '"]');
        if (cat && li) startCatalogRename(li, cat);
      }
    });
    catCtxMenu.addEventListener("pointerdown", e => e.stopPropagation());
    catCtxMenu.addEventListener("contextmenu", e => e.preventDefault());

    catalogList.addEventListener("dblclick", e => {
      const nameEl = e.target.closest(".catalog-item-name");
      if (!nameEl) return;
      const li = nameEl.closest(".catalog-item");
      const cat = state.catalogs.find(c => c.id === (li && li.dataset.catId));
      if (cat) startCatalogRename(li, cat);
    });

    // 侧栏目录拖拽：用专用 dataTransfer 类型，不影响树上节点改挂载
    catalogList.addEventListener("dragstart", e => {
      const li = e.target.closest(".catalog-item");
      if (!li) return;
      catalogDragId = li.dataset.catId;
      dragId = null; // 两种拖拽互斥
      li.classList.add("dragging-cat");
      e.dataTransfer.effectAllowed = "link";
      e.dataTransfer.setData(CATALOG_DRAG_TYPE, String(catalogDragId));
      e.dataTransfer.setData("text/plain", "catalog:" + catalogDragId);
    });
    catalogList.addEventListener("dragend", () => {
      catalogDragId = null;
      catalogList.querySelectorAll(".dragging-cat").forEach(el => el.classList.remove("dragging-cat"));
      clearCatDropMarks();
    });

    // ---------- 主题切换（浅色 / 暗色） ----------
    // 偏好存独立 key signin-tracker-theme（"light" | "dark"），不动签到数据；
    // 未存过时由 <head> 引导脚本按 prefers-color-scheme 决定默认主题。
    const THEME_KEY = "signin-tracker-theme";
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }
    function applyThemeBadge() {
      const dark = currentTheme() === "dark";
      themeToggleBtn.textContent = dark ? "☀️" : "🌙";
      themeToggleBtn.title = dark ? "切换到浅色主题" : "切换到暗色主题";
    }
    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      refreshBranchHexes(); // 分支/连线/目录圈颜色按主题重取 CSS 变量
      applyThemeBadge();
      render(); // 重画分支与目录圈颜色
    }
    themeToggleBtn.addEventListener("click", () => {
      setTheme(currentTheme() === "dark" ? "light" : "dark");
    });
    refreshBranchHexes(); // 首帧分支颜色与当前主题一致
    applyThemeBadge();

    /* ==== CANVAS-CONTROLS 事件绑定 ==== */
    // 右下角工具条：放大 / 缩小 / 百分比（点击回 100%）/ 适应画布 / 全部展开
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomLabelBtn = document.getElementById("zoomLabelBtn");
    const fitViewBtn = document.getElementById("fitViewBtn");
    const expandAllBtn = document.getElementById("expandAllBtn");
    if (zoomInBtn) zoomInBtn.addEventListener("click", () => zoomAtCenter(scale * 1.2));
    if (zoomOutBtn) zoomOutBtn.addEventListener("click", () => zoomAtCenter(scale / 1.2));
    if (zoomLabelBtn) zoomLabelBtn.addEventListener("click", () => zoomAtCenter(1));
    if (fitViewBtn) fitViewBtn.addEventListener("click", () => applyFitView());
    if (expandAllBtn) expandAllBtn.addEventListener("click", expandAllCollapsed);

    // 顶部搜索框（展开式）：聚焦/有内容时展开，失焦且为空时收起
    const canvasSearch = document.getElementById("canvasSearch");
    const searchToggleBtn = document.getElementById("searchToggleBtn");
    const searchInput = document.getElementById("searchInput");
    const undoFilterBtn = document.getElementById("undoFilterBtn");
    function setSearchOpen(open) {
      if (!canvasSearch || !searchToggleBtn) return;
      canvasSearch.classList.toggle("open", open);
      searchToggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    if (searchToggleBtn) searchToggleBtn.addEventListener("click", () => {
      const open = canvasSearch.classList.contains("open");
      setSearchOpen(!open);
      if (!open && searchInput) searchInput.focus();
    });
    if (searchInput) {
      searchInput.addEventListener("focus", () => setSearchOpen(true));
      searchInput.addEventListener("input", () => {
        searchKeyword = searchInput.value;
        setSearchOpen(true);
        applySearchFilter();
      });
      searchInput.addEventListener("blur", () => {
        if (!searchKeyword.trim()) setSearchOpen(false);
      });
      searchInput.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          e.preventDefault();
          searchKeyword = "";
          searchInput.value = "";
          applySearchFilter();
          searchInput.blur();
        }
      });
    }
    // 只看未完成：已完成的叶子淡化（分支照常）；会话内开关，不持久化
    if (undoFilterBtn) undoFilterBtn.addEventListener("click", () => {
      filterUndoneOnly = !filterUndoneOnly;
      undoFilterBtn.setAttribute("aria-pressed", filterUndoneOnly ? "true" : "false");
      applySearchFilter();
    });

    // ---------- 日历面板交互 ----------
    document.getElementById("calGrid").addEventListener("click", e => {
      const cell = e.target.closest("button[data-date]");
      if (!cell) return;
      selectedDate = cell.dataset.date;
      // 切日期只影响 daily 节点显示与统计，once 节点状态不变
      render();
    });
    document.getElementById("calPrevBtn").addEventListener("click", () => {
      calEnsureView();
      calView = calView.m === 0 ? { y: calView.y - 1, m: 11 } : { y: calView.y, m: calView.m - 1 };
      renderCalendarPanel();
    });
    document.getElementById("calNextBtn").addEventListener("click", () => {
      calEnsureView();
      calView = calView.m === 11 ? { y: calView.y + 1, m: 0 } : { y: calView.y, m: calView.m + 1 };
      renderCalendarPanel();
    });
    document.getElementById("dailyCollapseBtn").addEventListener("click", () => {
      state.calendarOpen = false;
      save(false); // 视图开合不算一次用户数据变更：落盘但不进撤销栈
      renderCalendarPanel();
      scheduleViewportUpdate(); // 面板收起改变舞台宽度，刷新可见集
    });
    document.getElementById("dailyRail").addEventListener("click", () => {
      state.calendarOpen = true;
      selectedDate = todayIso(); // 展开时回到今天
      calView = null;
      save(false); // 视图开合同上：不污染撤销栈
      renderCalendarPanel();
      scheduleViewportUpdate();
    });

    applySidebarOpen();
    // 首次打开：若当前目录是大树（例如上次停在 NeurCross），自动缩放到整棵树可见，
    // 不再从顶端 1:1 绘制导致长时间无响应
    pendingAutoFit = true;
    render();
    // 基线快照：加载完成后的初始状态作为历史起点（它是「第 0 步」，不占操作步数）
    pushHistory();
    updateHistoryUi();
    updateZoomLabel();
  </script>
</body>
</html>
